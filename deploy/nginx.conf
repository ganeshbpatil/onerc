# /etc/nginx/sites-available/one-racecourse  →  symlink into sites-enabled
# Cloudflare (Full strict) → NGINX :443 → Next.js on 127.0.0.1:3000 (never public)

# Restore real client IPs from Cloudflare (refresh list: https://www.cloudflare.com/ips/)
# include /etc/nginx/snippets/cloudflare-realip.conf;
real_ip_header CF-Connecting-IP;

limit_req_zone $binary_remote_addr zone=leads:10m rate=10r/m;
limit_req_status 429;

upstream one_racecourse { server 127.0.0.1:3000; keepalive 32; }

server {
  listen 80;
  listen [::]:80;
  server_name oneracecourse.com www.oneracecourse.com;   # [CONTENT REQUIRED] final domain
  return 301 https://www.oneracecourse.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name oneracecourse.com;
  ssl_certificate     /etc/ssl/cloudflare/origin.pem;     # Cloudflare Origin Certificate
  ssl_certificate_key /etc/ssl/cloudflare/origin.key;
  return 301 https://www.oneracecourse.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.oneracecourse.com;

  ssl_certificate     /etc/ssl/cloudflare/origin.pem;
  ssl_certificate_key /etc/ssl/cloudflare/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;

  client_max_body_size 64k;            # lead payloads are tiny
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  access_log /var/log/nginx/one-racecourse.access.log;
  error_log  /var/log/nginx/one-racecourse.error.log warn;

  # Immutable build assets
  location /_next/static/ {
    proxy_pass http://one_racecourse;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /api/leads {
    limit_req zone=leads burst=5 nodelay;
    limit_except POST { deny all; }
    proxy_pass http://one_racecourse;
    include /etc/nginx/snippets/next-proxy.conf;
  }

  location / {
    proxy_pass http://one_racecourse;
    include /etc/nginx/snippets/next-proxy.conf;
  }
}
