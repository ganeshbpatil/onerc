# One Racecourse — NGINX reverse proxy (template; deploy/install.sh fills __SERVER_NAMES__ / __PORT__).
# certbot --nginx later adds the 443/SSL server and the HTTP→HTTPS redirect to this file.

limit_req_zone $binary_remote_addr zone=orc_leads:10m rate=10r/m;

upstream one_racecourse { server 127.0.0.1:__PORT__; keepalive 32; }

server {
  listen 80;
  listen [::]:80;
  server_name __SERVER_NAMES__;

  # Behind Cloudflare? Uncomment so rate limits and logs see real visitor IPs.
  # include /etc/nginx/snippets/cloudflare-realip.conf;

  client_max_body_size 64k;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
  gzip_min_length 1024;

  access_log /var/log/nginx/one-racecourse.access.log;
  error_log  /var/log/nginx/one-racecourse.error.log warn;

  location /_next/static/ {
    proxy_pass http://one_racecourse;
    include /etc/nginx/snippets/next-proxy.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /api/leads {
    limit_req zone=orc_leads burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://one_racecourse;
    include /etc/nginx/snippets/next-proxy.conf;
  }

  location / {
    proxy_pass http://one_racecourse;
    include /etc/nginx/snippets/next-proxy.conf;
  }
}
